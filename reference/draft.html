<title>Ready Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Locker-room checklist: big condensed counters, full-width tap rows, ticked items sink to the bottom. */
:root {
  --bg: #F2F3F7;
  --surface: #FFFFFF;
  --line: #DFE2EC;
  --ink: #151A2C;
  --muted: #646B83;
  --accent: #2747E8;
  --accent-soft: #E7EBFD;
  --done: #178A5C;
  --on-done: #FFFFFF;
  --danger: #C4352B;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1120; --surface: #181C2E; --line: #2A3046; --ink: #ECEEF6; --muted: #8C93AC;
    --accent: #8197FF; --accent-soft: #232B52; --done: #3FC98C; --on-done: #0B1A13; --danger: #FF7A6E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1120; --surface: #181C2E; --line: #2A3046; --ink: #ECEEF6; --muted: #8C93AC;
  --accent: #8197FF; --accent-soft: #232B52; --done: #3FC98C; --on-done: #0B1A13; --danger: #FF7A6E;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; }

/* ---------- shared ---------- */
.eyebrow {
  margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}
.display {
  font-family: var(--display); font-weight: 700; text-transform: uppercase;
  letter-spacing: .01em; line-height: .95; margin: 0; text-wrap: balance;
}
.text-btn {
  background: none; border: 0; padding: 8px 4px; font-weight: 600; color: var(--accent);
}
.solid-btn {
  background: var(--accent); color: var(--surface); border: 0; border-radius: 12px;
  padding: 12px 18px; font-weight: 600;
}
.line-btn {
  background: transparent; border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 18px; font-weight: 600; color: var(--ink);
}
.field {
  width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 13px 14px;
}
.field::placeholder { color: var(--muted); }

/* ---------- home ---------- */
.home-head { display: grid; gap: 6px; padding-block: 8px 24px; }
.home-head h1 { font-size: 56px; }
.home-head p.lede { margin: 0; color: var(--muted); }
.cards { display: grid; gap: 10px; }
.card {
  width: 100%; text-align: left; display: grid; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
}
.card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card-name { font-family: var(--display); font-weight: 700; font-size: 28px; text-transform: uppercase; line-height: 1; min-width: 0; overflow-wrap: anywhere; }
.card-meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip {
  justify-self: start; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  background: var(--done); color: var(--on-done); border-radius: 999px; padding: 3px 10px;
}
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.full > span { background: var(--done); }
.new-area { margin-top: 14px; }
.new-trigger {
  width: 100%; background: transparent; border: 1.5px dashed var(--line); border-radius: 16px;
  padding: 16px; font-weight: 600; color: var(--accent);
}
.new-form { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.new-form .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- list screen ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg); margin-inline: -16px; padding-inline: 12px; padding-block: 4px;
}
.list-head { display: grid; gap: 12px; padding-block: 10px 18px; }
.list-head h1 { font-size: 44px; overflow-wrap: anywhere; }
.rename { font-family: var(--display); font-weight: 700; font-size: 30px; text-transform: uppercase; }
.count { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.count .num { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: .85; }
.count .of { font-family: var(--display); font-weight: 600; font-size: 30px; color: var(--muted); }
.count .lbl { color: var(--muted); font-size: 14px; margin-left: 4px; }
.segs { display: flex; gap: 3px; height: 8px; }
.seg { flex: 1; border-radius: 2px; background: var(--line); transition: background-color .2s; }
.seg.on { background: var(--accent); }
.segs.complete .seg.on { background: var(--done); }

.ready {
  background: var(--done); color: var(--on-done); border-radius: 18px;
  padding: 20px; margin-bottom: 14px; display: grid; gap: 6px;
  animation: rise .35s cubic-bezier(.2,.8,.2,1);
}
.ready h2 { font-size: 46px; }
.ready p { margin: 0; font-weight: 500; }
.ready button {
  justify-self: start; margin-top: 8px; background: var(--on-done); color: var(--done);
  border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600;
}

.items { display: flex; flex-direction: column; gap: 8px; }
.row { will-change: transform; }
.tick {
  width: 100%; min-height: 58px; display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; text-align: left;
  transition: background-color .2s, border-color .2s;
}
.tick:active { transform: scale(.985); }
.box {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--muted); display: grid; place-items: center;
}
.box svg { width: 16px; height: 16px; opacity: 0; }
.box path { fill: none; stroke: var(--on-done); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.txt { min-width: 0; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.strike {
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat; background-position: 0 56%; background-size: 0 2px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.is-done .tick { background: transparent; border-style: dashed; }
.is-done .box { background: var(--done); border-color: var(--done); }
.is-done .box svg { opacity: 1; }
.is-done .txt { color: var(--muted); font-weight: 400; }
.is-done .strike { background-size: 100% 2px; }
.just .strike { animation: strike .3s ease-out; }
.just .box { animation: pop .3s cubic-bezier(.2,1.6,.4,1); }
.divider {
  display: flex; align-items: center; gap: 10px; padding-block: 10px 2px;
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.add-row form { display: flex; gap: 8px; }
.add-row .solid-btn { flex: none; }
.empty { color: var(--muted); margin: 0 0 10px; }

.edit-row { display: flex; gap: 8px; align-items: center; }
.del {
  flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--danger); font-size: 22px; line-height: 1;
}
.foot { display: grid; gap: 10px; margin-top: 22px; }
.danger-btn {
  background: transparent; border: 1px solid var(--danger); color: var(--danger);
  border-radius: 12px; padding: 12px 18px; font-weight: 600;
}
.confirm { background: var(--surface); border: 1px solid var(--danger); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.confirm p { margin: 0; }
.confirm .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.confirm .actions .danger-btn { background: var(--danger); color: var(--surface); }

@keyframes strike { from { background-size: 0 2px; } to { background-size: 100% 2px; } }
@keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
@keyframes rise { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div id="app"></div>

<script>
(function () {
  var KEY = 'readycheck.v1';
  var app = document.getElementById('app');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function mk(name, items) {
    return { id: uid(), name: name, items: items.map(function (t) { return { id: uid(), text: t, done: false, doneAt: null }; }) };
  }
  function seed() {
    return { lists: [
      mk('Gym bag', ['Towel', 'Water bottle filled', 'Training shoes', 'Shaker + protein', 'Headphones charged', 'Locker lock', 'Change of clothes', 'Gym card']),
      mk('Table tennis training', ['Racket in case', 'Balls (3+)', 'Indoor court shoes', 'Towel', 'Wristband', 'Water', 'Spare shirt']),
      mk('Leaving the house', ['Keys', 'Wallet', 'Phone charged', 'AirPods', 'Lights off', 'Door locked'])
    ] };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); if (d && Array.isArray(d.lists)) return d; }
    } catch (e) {}
    return seed();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var store = load();
  var view = { screen: 'home', listId: null, editing: false, confirmDelete: false, newOpen: false, just: null, focus: null };

  function current() { return store.lists.find(function (l) { return l.id === view.listId; }); }
  function stats(list) {
    var done = list.items.filter(function (i) { return i.done; }).length;
    return { done: done, total: list.items.length };
  }

  /* ---------- views ---------- */
  function homeHTML() {
    var d = new Date();
    var date = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    var cards = store.lists.map(function (l) {
      var s = stats(l), pct = s.total ? Math.round(s.done / s.total * 100) : 0;
      var full = s.total > 0 && s.done === s.total;
      return '<li><button class="card" data-open="' + l.id + '">' +
        '<span class="card-top"><span class="card-name">' + esc(l.name) + '</span>' +
        '<span class="card-meta">' + s.done + ' / ' + s.total + '</span></span>' +
        '<span class="meter' + (full ? ' full' : '') + '"><span style="width:' + pct + '%"></span></span>' +
        (full ? '<span class="chip">Ready</span>' : '') +
        '</button></li>';
    }).join('');
    var newArea = view.newOpen
      ? '<form class="new-form" id="new-form"><label class="eyebrow" for="new-name">New checklist</label>' +
        '<input class="field" id="new-name" placeholder="e.g. Tournament day" autocomplete="off">' +
        '<div class="actions"><button class="solid-btn" type="submit">Create</button>' +
        '<button class="line-btn" type="button" data-act="cancel-new">Cancel</button></div></form>'
      : '<button class="new-trigger" data-act="new">+ New checklist</button>';
    return '<header class="home-head"><p class="eyebrow">' + esc(date) + '</p>' +
      '<h1 class="display">Ready Check</h1>' +
      '<p class="lede">Pick a checklist, tick through it, go.</p></header>' +
      '<ul class="cards">' + cards + '</ul>' +
      '<div class="new-area">' + newArea + '</div>';
  }

  function rowHTML(i) {
    if (view.editing) {
      return '<li class="row edit-row" data-id="' + i.id + '">' +
        '<input class="field" data-item="' + i.id + '" id="item-' + i.id + '" value="' + esc(i.text) + '" aria-label="Item name">' +
        '<button class="del" data-del="' + i.id + '" aria-label="Delete ' + esc(i.text) + '">&times;</button></li>';
    }
    var cls = 'row' + (i.done ? ' is-done' : '') + (view.just === i.id && i.done ? ' just' : '');
    return '<li class="' + cls + '" data-id="' + i.id + '">' +
      '<button class="tick" data-toggle="' + i.id + '" aria-pressed="' + i.done + '">' +
      '<span class="box">' + CHECK + '</span>' +
      '<span class="txt"><span class="strike">' + esc(i.text) + '</span></span></button></li>';
  }

  function listHTML() {
    var l = current();
    var s = stats(l);
    var complete = s.total > 0 && s.done === s.total;
    var todo = l.items.filter(function (i) { return !i.done; });
    var done = l.items.filter(function (i) { return i.done; }).sort(function (a, b) { return (a.doneAt || 0) - (b.doneAt || 0); });

    var segs = l.items.map(function (_, idx) { return '<span class="seg' + (idx < s.done ? ' on' : '') + '"></span>'; }).join('');
    var title = view.editing
      ? '<input class="field rename" id="rename" value="' + esc(l.name) + '" aria-label="Checklist name">'
      : '<h1 class="display">' + esc(l.name) + '</h1>';

    var ready = (complete && !view.editing)
      ? '<section class="ready" aria-live="polite"><p class="eyebrow" style="color:inherit;opacity:.8">All ' + s.total + ' checked</p>' +
        '<h2 class="display">Ready to go</h2><p>Everything on the list is with you.</p>' +
        '<button data-act="reset">Reset for next time</button></section>'
      : '';

    var addRow = '<li class="add-row"><form id="add-form"><input class="field" id="add-input" placeholder="Add item" autocomplete="off" aria-label="New item">' +
      '<button class="solid-btn" type="submit">Add</button></form></li>';

    var rows = todo.map(rowHTML).join('') + addRow +
      (done.length ? '<li class="divider">Checked</li>' + done.map(rowHTML).join('') : '');

    var foot = '';
    if (view.editing) {
      foot = view.confirmDelete
        ? '<div class="confirm"><p>Delete “' + esc(l.name) + '” and its ' + s.total + ' items?</p>' +
          '<div class="actions"><button class="danger-btn" data-act="delete-list">Delete checklist</button>' +
          '<button class="line-btn" data-act="keep-list">Keep it</button></div></div>'
        : '<button class="danger-btn" data-act="ask-delete">Delete checklist</button>';
    } else if (s.done > 0 && !complete) {
      foot = '<button class="line-btn" data-act="reset">Uncheck all</button>';
    }

    return '<nav class="bar"><button class="text-btn" data-act="back">‹ Lists</button>' +
      '<button class="text-btn" data-act="edit">' + (view.editing ? 'Done' : 'Edit') + '</button></nav>' +
      '<header class="list-head">' + title +
      '<div class="count"><span class="num">' + s.done + '</span><span class="of">/ ' + s.total + '</span><span class="lbl">checked</span></div>' +
      (s.total ? '<div class="segs' + (complete ? ' complete' : '') + '">' + segs + '</div>' : '') +
      '</header>' + ready +
      (s.total === 0 ? '<p class="empty">No items yet. Add the first one below.</p>' : '') +
      '<ul class="items">' + rows + '</ul>' +
      (foot ? '<div class="foot">' + foot + '</div>' : '');
  }

  /* ---------- render with FLIP so ticked rows glide down ---------- */
  function render(animate) {
    var first = null;
    if (animate && !reduced) {
      first = {};
      app.querySelectorAll('.row[data-id]').forEach(function (el) { first[el.dataset.id] = el.getBoundingClientRect().top; });
    }
    app.innerHTML = view.screen === 'home' ? homeHTML() : listHTML();
    if (first) {
      app.querySelectorAll('.row[data-id]').forEach(function (el) {
        var t = first[el.dataset.id];
        if (t == null) return;
        var dy = t - el.getBoundingClientRect().top;
        if (!dy) return;
        el.style.transition = 'none';
        el.style.transform = 'translateY(' + dy + 'px)';
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            el.style.transition = 'transform .34s cubic-bezier(.2,.8,.2,1)';
            el.style.transform = '';
          });
        });
      });
    }
    if (view.focus) {
      var f = document.getElementById(view.focus);
      if (f) f.focus({ preventScroll: view.focus === 'add-input' ? false : true });
      view.focus = null;
    }
    view.just = null;
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-open],[data-toggle],[data-del],[data-act]');
    if (!t) return;
    var l = current();

    if (t.dataset.open) {
      view = { screen: 'list', listId: t.dataset.open, editing: false, confirmDelete: false, newOpen: false };
      render(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.toggle) {
      var it = l.items.find(function (i) { return i.id === t.dataset.toggle; });
      it.done = !it.done; it.doneAt = it.done ? Date.now() : null;
      view.just = it.id; save(); render(true); return;
    }
    if (t.dataset.del) {
      l.items = l.items.filter(function (i) { return i.id !== t.dataset.del; });
      save(); render(true); return;
    }
    switch (t.dataset.act) {
      case 'back': view = { screen: 'home', listId: null, editing: false, confirmDelete: false, newOpen: false }; render(); break;
      case 'edit': view.editing = !view.editing; view.confirmDelete = false; render(); break;
      case 'reset': l.items.forEach(function (i) { i.done = false; i.doneAt = null; }); save(); render(true); window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); break;
      case 'new': view.newOpen = true; view.focus = 'new-name'; render(); break;
      case 'cancel-new': view.newOpen = false; render(); break;
      case 'ask-delete': view.confirmDelete = true; render(); break;
      case 'keep-list': view.confirmDelete = false; render(); break;
      case 'delete-list':
        store.lists = store.lists.filter(function (x) { return x.id !== l.id; });
        save(); view = { screen: 'home', listId: null, editing: false, confirmDelete: false, newOpen: false }; render(); break;
    }
  });

  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'add-form') {
      var inp = document.getElementById('add-input');
      var text = inp.value.trim();
      if (!text) return;
      current().items.push({ id: uid(), text: text, done: false, doneAt: null });
      save(); view.focus = 'add-input'; render(true);
    }
    if (e.target.id === 'new-form') {
      var name = document.getElementById('new-name').value.trim();
      if (!name) return;
      var nl = { id: uid(), name: name, items: [] };
      store.lists.push(nl); save();
      view = { screen: 'list', listId: nl.id, editing: false, confirmDelete: false, newOpen: false, focus: 'add-input' };
      render(); window.scrollTo(0, 0);
    }
  });

  app.addEventListener('input', function (e) {
    var l = current();
    if (!l) return;
    if (e.target.id === 'rename') { l.name = e.target.value.trim() || 'Untitled'; save(); }
    if (e.target.dataset.item) {
      var it = l.items.find(function (i) { return i.id === e.target.dataset.item; });
      if (it) { it.text = e.target.value.trim() || it.text; save(); }
    }
  });

  render();
})();
</script>
