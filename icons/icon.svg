<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ready Check app icon. Full-bleed: iOS and Android apply their own corner mask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3556F2"/>
      <stop offset="1" stop-color="#1E3AD0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Same check as the in-app tick box (M3 8.5l3.2 3L13 4.5 on a 16 grid), scaled 28x -->
  <path d="M3 8.5l3.2 3L13 4.5" transform="translate(32 32) scale(28)"
        fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
